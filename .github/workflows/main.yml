name: kakao-briefing-relay
"on":
  schedule:
    # 아침 3종 — 캄보디아 04:00~07:00 (UTC 21~23시)
    - cron: '3,18,33,48 21-23 * * *'
    # 장중 — 캄보디아 07:00~13:59 (UTC 0~6시), 평일만
    - cron: '*/15 0-6 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식'
        type: choice
        default: run
        options:
          - run
          - resend
concurrency:
  group: kakao-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_TOKEN_NEWS: ${{ secrets.TELEGRAM_BOT_TOKEN_NEWS }}
      TELEGRAM_CHAT_ID_NEWS: ${{ secrets.TELEGRAM_CHAT_ID_NEWS }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: 한글 폰트
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum && fc-cache -f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests pillow
      - name: 시크릿 길이 확인
        run: |
          echo "TELEGRAM_BOT_TOKEN      : ${#TELEGRAM_BOT_TOKEN} chars"
          echo "TELEGRAM_CHAT_ID        : ${#TELEGRAM_CHAT_ID} chars"
          echo "TELEGRAM_BOT_TOKEN_NEWS : ${#TELEGRAM_BOT_TOKEN_NEWS} chars"
          echo "TELEGRAM_CHAT_ID_NEWS   : ${#TELEGRAM_CHAT_ID_NEWS} chars"
          echo "GMAIL_ADDRESS           : ${#GMAIL_ADDRESS} chars"
          echo "GMAIL_APP_PASSWORD      : ${#GMAIL_APP_PASSWORD} chars"
      - name: 릴레이 실행
        run: python kakao_relay.py ${{ inputs.mode || 'run' }}
      - name: state 저장
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "kakao-relay"
            git config user.email "relay@users.noreply.github.com"
            git add state.json
            git diff --staged --quiet || git commit -m "update state [skip ci]"
            git pull --rebase --autostash || true
            git push || echo "push failed"
          fi
