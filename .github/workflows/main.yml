name: kakao-briefing-relay

"on":
  schedule:
    - cron: '*/15 21-23,0-7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식'
        type: choice
        default: run
        options:
          - run
          - resend

concurrency:
  group: kakao-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_TOKEN_NEWS: ${{ secrets.TELEGRAM_BOT_TOKEN_NEWS }}
      TELEGRAM_CHAT_ID_NEWS: ${{ secrets.TELEGRAM_CHAT_ID_NEWS }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 한글 폰트
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum && fc-cache -f

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet requests pillow

      - name: 시세 수집
        continue-on-error: true
        timeout-minutes: 2
        run: python quotes.py

      - name: 릴레이 실행
        timeout-minutes: 3
        run: python kakao_relay.py ${{ inputs.mode || 'run' }}

      - name: state·quotes 저장
        if: always()
        run: |
          git config user.name "kakao-relay"
          git config user.email "relay@users.noreply.github.com"
          for f in state.json quotes.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "update state/quotes [skip ci]"
          git push || echo "push failed"
