name: kakao-briefing-relay

"on":
  schedule:
    - cron: '*/10 21-23 * * *'
    - cron: '*/30 0-6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: kakao-relay

jobs:
  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum && fc-cache -f

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet requests pillow

      - name: check secrets
        run: |
          echo "TELEGRAM_BOT_TOKEN  : ${#TELEGRAM_BOT_TOKEN} chars"
          echo "TELEGRAM_CHAT_ID    : ${#TELEGRAM_CHAT_ID} chars"
          echo "KAKAO_REST_API_KEY  : ${#KAKAO_REST_API_KEY} chars"
          echo "GMAIL_ADDRESS       : ${#GMAIL_ADDRESS} chars"
          echo "GMAIL_APP_PASSWORD  : ${#GMAIL_APP_PASSWORD} chars"

      - run: python kakao_relay.py run

      - name: save state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "kakao-relay"
            git config user.email "relay@users.noreply.github.com"
            git add state.json
            git diff --staged --quiet || git commit -m "update state [skip ci]"
            git push || echo "push failed"
          fi
